[project]
name = "jev-llm-cost-router"
version = "0.1.0"
description = "Route prompts between a small and a large LLM using Jev, and measure whether it beats simple baselines."
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.5",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1",
    "datasets>=3",
    "pandas>=2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
