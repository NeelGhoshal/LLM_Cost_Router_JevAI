# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. Render asks for the two secret keys on first deploy.
services:
  - type: web
    name: jev-cost-router
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GROQ_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: RATE_PER_MINUTE
        value: "6"
      - key: DAILY_REQUEST_CAP
        value: "300"
